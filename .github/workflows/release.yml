name: Release

# Run "Cut a release" (cut-release.yml) under Actions, or push a tag such as v0.2.0 as the repository owner, to publish
# the NuGet packages (library, ASP.NET Core integration and the `semantic-router` dotnet tool), the container image
# (ghcr.io/<owner>/semantic-router) and the desktop app (self-contained downloads for Windows, macOS and Linux, and the
# installers with their update feeds, attached to the GitHub release). Only the repository owner can release.
#
# Every release can be verified (docs/releases.md): the image is signed with keyless cosign and carries provenance and
# SBOM attestations; every release asset, the NuGet packages included, has a build provenance attestation and a line in
# SHA256SUMS; CycloneDX SBOMs (the packages, the image, and each platform's archive and installer, each naming what it
# describes and every package's licence) and THIRD-PARTY-NOTICES.txt are attached. Signatures and attestations use
# short-lived Sigstore certificates issued to this workflow (GitHub OIDC), so no signing key is stored anywhere. The
# jobs that hold the OIDC token build nothing; they sign and attest what the build jobs produced, after any code
# signing.
#
# Nothing is public until everything is ready (docs/releases.md#the-order-of-a-release). Everything is built, signed,
# checked and attached to a draft GitHub release first, which nobody but the maintainers sees and which the desktop
# app's updater does not read. SHA256SUMS and the provenance attestation are added to the draft too. Only then, one
# after another, the image is pushed and signed, the NuGet packages are pushed, and the draft is published. So a
# failure in a build, installer or signing job leaves a draft (and, after checksums, its public attestation) and nothing
# else: no package on nuget.org, no new image tag and no public release. deploy/release-order-check.sh, which CI runs,
# keeps this order.
#
# A tag with a suffix (v1.0.0-rc.1) is a prerelease: the GitHub release is marked as one, so the desktop app's updater
# (which skips prereleases) never offers it, and the image gets its version tag but not :latest. NuGet treats the
# suffix as a prerelease by itself. "Cut a release" makes stable releases only; push such a tag by hand for a candidate.
#
# The Windows and macOS installers must be code-signed: a release fails at its first job when a platform's signing
# secrets are missing, unless the variable ALLOW_UNSIGNED_RELEASE is `true` (docs/releases.md#code-signing). "Cut a
# release" also asks for its "Allow unsigned installers" box to be ticked before it tags such a release.
on:
  push:
    tags: [ 'v*' ]

# Read-only by default; each job that publishes, signs or attests asks for the extra permissions it needs (id-token and
# attestations only in image-sign and checksums, the jobs that build nothing). Every publishing job runs in the `release`
# environment, so the repository owner can require an approval under Settings > Environments (and restrict it to `main`
# and v* tags: cut-release.yml runs there from main). Publishing to nuget.org needs the `NUGET_USER` variable there (see
# the nuget job).
permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    environment: release
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    outputs:
      # signed or unsigned, per platform; the installer jobs sign and check signatures by these.
      windows-signing: ${{ steps.signing.outputs.windows }}
      macos-signing: ${{ steps.signing.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the repository owner releases: a v* tag pushed by anyone else publishes nothing, since every other job needs
      # this one. The "Cut a release" workflow (cut-release.yml) creates the tag with the owner's token, so its tag is the
      # owner's too.
      - name: The repository owner released it
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can release: $GITHUB_REF_NAME was pushed by $ACTOR (triggered by $TRIGGERING_ACTOR)."
            exit 1
          fi

      # Releases are built from reviewed code only: a tag on a commit that is not on main publishes nothing, since every
      # other job needs this one.
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      # Code signing is required, and checked here so that a release without it publishes nothing (the script says how
      # each platform's state is decided; cut-release.yml runs the same check before it tags). Only whether each secret
      # is set reaches this job, as true or false, never its value.
      - name: Code signing
        id: signing
        env:
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
          WINDOWS: >-
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID != '' }}
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID != '' }}
            AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET != '' }}
            AZURE_SIGNING_ENDPOINT=${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
            AZURE_SIGNING_ACCOUNT=${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
            AZURE_SIGNING_PROFILE=${{ vars.AZURE_SIGNING_PROFILE != '' }}
          MACOS: >-
            APPLE_BUILD_CERTIFICATE_BASE64=${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 != '' }}
            APPLE_INSTALLER_CERTIFICATE_BASE64=${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 != '' }}
            APPLE_P12_PASSWORD=${{ secrets.APPLE_P12_PASSWORD != '' }}
            APPLE_ID=${{ secrets.APPLE_ID != '' }}
            APPLE_APP_PASSWORD=${{ secrets.APPLE_APP_PASSWORD != '' }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}
            APPLE_SIGN_APP_IDENTITY=${{ vars.APPLE_SIGN_APP_IDENTITY != '' }}
            APPLE_SIGN_INSTALL_IDENTITY=${{ vars.APPLE_SIGN_INSTALL_IDENTITY != '' }}
        run: deploy/release-signing-check.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Exactly the packages in the projects' packages.lock.json files; the restores in test and pack below then find
      # nothing to change.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test --configuration Release

      # The vpk the installer jobs install is the Velopack package's version, whose native binaries and Rust crates the
      # desktop notices list.
      - name: Velopack versions
        run: deploy/velopack-version-check.sh

      # The tool package carries the licences and notices of the packages it ships, and of the fonts.
      - name: Third-party notices
        run: |
          dotnet run --file deploy/third-party-notices.cs -- notices/THIRD-PARTY-NOTICES.txt src/SemanticRouter.Host/bin/Release/net10.0
          deploy/third-party-notices-check.sh notices/THIRD-PARTY-NOTICES.txt "Inter (font)" "Fira Sans (font)"

      - name: Pack
        run: |
          dotnet pack --configuration Release --output artifacts -p:Version="$VERSION" \
            -p:ThirdPartyNoticesFile="$PWD/notices/THIRD-PARTY-NOTICES.txt"

      # Each package has its readme, icon and copyright for nuget.org, and each library its symbol package (.snupkg),
      # whose PDB SourceLink maps to this commit's sources.
      - name: Package contents
        run: deploy/package-contents-check.sh artifacts

      # A CycloneDX SBOM of the NuGet packages, read from their contents: the tool's deps.json and each package's
      # assemblies. deploy/sbom-complete.cs then names the release as its subject, gives every package its licence (from
      # the nuspecs restore put in the NuGet cache) and adds the fonts, which Syft cannot see (docs/releases.md).
      - name: SBOM input
        run: |
          for package in artifacts/*.nupkg; do
            name="$(basename "$package" .nupkg)"
            mkdir -p "sbom/$name" && unzip -q "$package" -d "sbom/$name"
          done

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom
          format: cyclonedx-json
          output-file: SemanticRouter-${{ env.VERSION }}-packages.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Complete the SBOM
        run: |
          sbom="SemanticRouter-$VERSION-packages.cdx.json"
          dotnet run --file deploy/sbom-complete.cs -- "$sbom" --type library --name SemanticRouter.NET --version "$VERSION" \
            --purl "pkg:github/${GITHUB_REPOSITORY,,}@v$VERSION" \
            --description "The SemanticRouter NuGet packages and the semantic-router tool" --contents sbom
          deploy/sbom-check.sh "$sbom" SemanticRouter.NET "$VERSION" "Inter (font)" "Fira Sans (font)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-packages
          path: SemanticRouter-${{ env.VERSION }}-packages.cdx.json

  # NuGet Trusted Publishing: no NuGet key is stored anywhere. This job exchanges its GitHub OIDC token for an API key
  # that nuget.org issues for one hour, under the policy on the nuget.org account (repository, release.yml, environment
  # `release`). It runs nothing but the push, so restore, build and test code in the job above never sees the token.
  # A release fails here rather than skipping the push: the README tells people to install from nuget.org. A version on
  # nuget.org can never be used again, so the push comes after everything else is signed, attached and checked and the
  # image is out; only publishing the draft release comes after it.
  nuget:
    needs: [ packages, image-sign ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check the nuget.org account is set
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER variable (the nuget.org profile name that owns the Trusted Publishing policy) under Settings > Environments > release."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the .snupkg of the same name beside it, to nuget.org's symbol server.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # The image is built, scanned and pushed in three jobs, so that neither the build nor the scanners (Trivy and Syft,
  # which download their binaries and Trivy's vulnerability database at run time) run next to a token that can push or
  # next to the docker daemon the push uses. The build only reads the repository, the scan holds no permission at all,
  # and the push runs no tool but docker: it loads the build's tarball, checks that it is the image the build made, and
  # checks that the registry holds that same image afterwards. So what is signed and attested is what was built and
  # scanned.
  image-build:
    needs: packages
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      version: ${{ steps.build.outputs.version }}
      id: ${{ steps.save.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag's version and the commit go into the assemblies (what the router reports) and the OCI labels.
      - name: Build
        id: build
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/semantic-router"
          version="${GITHUB_REF_NAME#v}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          docker build -f src/SemanticRouter.Host/Dockerfile \
            --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" \
            -t "$image:$version" -t "$image:latest" .

      # Nothing is published that reports another version than its tag: the router, the dashboard and the labels.
      - name: Check the version
        run: deploy/image-version-check.sh "$IMAGE:latest" "$VERSION" "$GITHUB_SHA"

      - name: Save
        id: save
        run: |
          echo "id=$(docker image inspect "$IMAGE:$VERSION" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          docker save "$IMAGE:$VERSION" "$IMAGE:latest" -o image.tar

      # Kept for a week, like the installers' full packages below: the push waits for the installers, and a failed
      # release is finished by re-running its failed jobs, which reuse these (docs/releases.md#when-a-release-fails).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          if-no-files-found: error
          retention-days: 7

  # No permission, so the job's token can do nothing, and no cache, so a cache entry written elsewhere cannot change
  # the scanner or its database.
  image-scan:
    needs: image-build
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE: ${{ needs.image-build.outputs.image }}
      VERSION: ${{ needs.image-build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load
        run: docker load -i image.tar

      # Nothing with a fixable high or critical vulnerability is published.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache: 'false'

      # The image's CycloneDX SBOM: completed in image-sbom, then attached to the release, and to the image as an
      # attestation (image-sign).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:latest
          format: cyclonedx-json
          output-file: SemanticRouter-${{ env.VERSION }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Scanners and inventories match the router by the version its SBOM names.
      - name: Check the SBOM's version
        run: |
          sbom="SemanticRouter-$VERSION-image.cdx.json"
          versions="$(jq -r '[.components[]? | select(.name == "semantic-router") | .version] | unique | join(" ")' "$sbom")"
          if [ "$versions" != "$VERSION" ]; then
            echo "::error::$sbom names semantic-router '${versions:-nothing}', expected '$VERSION'."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-syft
          path: SemanticRouter-${{ env.VERSION }}-image.cdx.json
          retention-days: 7

  # The image's SBOM gets its subject (the image and its version), its NuGet packages' licences from a restore of the
  # tool's packages, and the fonts, as the tool package's deps.json says (the image is the tool's build;
  # deploy/sbom-complete.cs). Here rather than in image-scan, which holds no permission and checks nothing out; before
  # the push, so no image is published without its completed SBOM.
  image-sbom:
    needs: [ image-build, image-scan ]
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      IMAGE: ${{ needs.image-build.outputs.image }}
      VERSION: ${{ needs.image-build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-syft

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Complete the SBOM
        run: |
          dotnet restore src/SemanticRouter.Host/SemanticRouter.Host.csproj --locked-mode
          mkdir -p tool && unzip -q packages/SemanticRouter.Host.*.nupkg -d tool
          sbom="SemanticRouter-$VERSION-image.cdx.json"
          dotnet run --file deploy/sbom-complete.cs -- "$sbom" --type container --name "$IMAGE" --version "$VERSION" \
            --purl "pkg:docker/${IMAGE#ghcr.io/}@$VERSION?repository_url=ghcr.io" --description "The semantic-router container image" \
            --contents tool
          deploy/sbom-check.sh "$sbom" "$IMAGE" "$VERSION" "Inter (font)" "Fira Sans (font)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: SemanticRouter-${{ env.VERSION }}-image.cdx.json

  # The image is pushed, as :VERSION and :latest, only once the draft release is complete: every installer signed and
  # checked, SHA256SUMS and the attestation attached (checksums). A failed installer or signing job leaves no new tag.
  image:
    needs: [ image-build, image-scan, image-sbom, checksums ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.image-build.outputs.image }}
      VERSION: ${{ needs.image-build.outputs.version }}
      BUILT: ${{ needs.image-build.outputs.id }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load
        run: |
          docker load -i image.tar
          for tag in "$VERSION" latest; do
            id="$(docker image inspect "$IMAGE:$tag" --format '{{.Id}}')"
            if [ "$id" != "$BUILT" ]; then
              echo "::error::$IMAGE:$tag is $id, but the build made $BUILT."
              exit 1
            fi
          done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digest is read back from the registry: what the version tag points to is what is signed and attested, and
      # it must be the image the build made.
      - name: Push
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          # A prerelease (a version with a suffix, 1.0.0-rc.1) is not what :latest users should get.
          if [[ "$VERSION" != *-* ]]; then
            docker push "$IMAGE:latest"
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::No digest for $IMAGE:$VERSION in the registry."
            exit 1
          fi
          docker pull -q "$IMAGE@$digest" >/dev/null
          id="$(docker image inspect "$IMAGE@$digest" --format '{{.Id}}')"
          if [ "$id" != "$BUILT" ]; then
            echo "::error::The registry's $IMAGE@$digest is $id, but the build made $BUILT."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Keyless signing of the pushed image, then its provenance and SBOM attestations, stored in the registry next to it.
  # cosign and actions/attest get a short-lived Sigstore certificate for this workflow from the job's GitHub OIDC token.
  # This job builds and runs nothing from the repository; the image jobs never hold the OIDC token.
  image-sign:
    needs: image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-image
          path: sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Storage records need an organization account and artifact-metadata: write; the attestations do not.
      - name: Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom/SemanticRouter-${{ env.VERSION }}-image.cdx.json
          push-to-registry: true
          create-storage-record: false

  # The desktop app is built in jobs that hold no secret and only read the repository; the jobs that sign, publish or
  # write to the release download what they built and run no build. So no third-party build code (NuGet packages'
  # MSBuild tasks included) ever runs next to a signing credential or a token that can change the release.
  desktop-build:
    needs: packages
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Every platform cross-publishes from Linux: the app is self-contained and its native parts come from NuGet.
      - name: Package
        run: |
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            deploy/package-desktop.sh "$rid" "$VERSION" artifacts
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # The release's own THIRD-PARTY-NOTICES.txt covers all it ships: the desktop app for every platform and the tool
      # (whose packages are also the image's). Each archive, installer, the tool package and the image carry their own
      # copy. The SBOMs are read from the archives' contents.
      - name: Notices and SBOM input
        run: |
          for archive in artifacts/*.zip artifacts/*.tar.gz; do
            name="$(basename "$archive")" && name="${name%.zip}" && name="${name%.tar.gz}"
            mkdir -p "sbom/$name"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "sbom/$name" ;;
              *) tar -C "sbom/$name" -xzf "$archive" ;;
            esac
          done
          mkdir -p tool && unzip -q packages/SemanticRouter.Host.*.nupkg -d tool
          dotnet restore src/SemanticRouter.Host/SemanticRouter.Host.csproj --locked-mode
          dotnet run --file deploy/third-party-notices.cs -- artifacts/THIRD-PARTY-NOTICES.txt sbom tool
          deploy/third-party-notices-check.sh artifacts/THIRD-PARTY-NOTICES.txt "Inter (font)" "Fira Sans (font)" \
            "Velopack native binaries" "Rust standard library" "AppImage type2-runtime"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      # One SBOM per platform, SemanticRouter-<version>-<rid>.cdx.json, named after the archive it describes and
      # completed with its packages' licences and the fonts (deploy/sbom-complete.cs). The installers' are made later,
      # from what vpk built (installer-sbom).
      - name: SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for archive in artifacts/*.zip artifacts/*.tar.gz; do
            file="$(basename "$archive")" && name="${file%.zip}" && name="${name%.tar.gz}" && rid="${name#"SemanticRouter-$VERSION-"}"
            sbom="artifacts/$name.cdx.json"
            "$SYFT" scan "dir:sbom/$name" -q -o "cyclonedx-json=$sbom"
            dotnet run --file deploy/sbom-complete.cs -- "$sbom" --type application --name "SemanticRouter-$rid" --version "$VERSION" \
              --purl "pkg:generic/SemanticRouter-$rid@$VERSION?download_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" \
              --description "The desktop app for $rid, as in $file" --contents "sbom/$name"
            deploy/sbom-check.sh "$sbom" "SemanticRouter-$rid" "$VERSION" "Inter (font)" "Fira Sans (font)"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: artifacts/*

  desktop:
    needs: desktop-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop
          path: artifacts

      # The release notes are the version's section of CHANGELOG.md at the tag (or its Unreleased section, when that was
      # not renamed before the release), followed by GitHub's list of merged pull requests.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" > CHANGELOG.md \
            || : > CHANGELOG.md
          section() {
            awk -v heading="## [$1]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md
          }
          notes="$(section "$version")"
          if [ -z "$(tr -d '[:space:]' <<<"$notes")" ]; then
            notes="$(section Unreleased)"
          fi
          printf '%s\n' "$notes" > notes.md

      # The release is created as a draft, which only the publish job makes public, once everything else is done. A
      # version with a suffix (1.0.0-rc.1) is created as a prerelease: the desktop app's updater skips those. On a
      # re-run, gh finds the draft by its tag and the archives replace the ones there.
      - name: Attach to the draft release
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --generate-notes --verify-tag --draft "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  # The app each installer packages, published on the installer's own OS (as before the split), without secrets. Tar
  # keeps the executable bits that an artifact would lose.
  installer-build:
    needs: packages
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          deploy/publish-desktop.sh "$RID" "${GITHUB_REF_NAME#v}" "publish/$RID"
          tar -C "publish/$RID" -czf "publish-$RID.tar.gz" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.rid }}
          path: publish-${{ matrix.rid }}.tar.gz

  # The installers (Velopack): each platform is a channel with its own update feed; the previous release's package is
  # fetched for a delta update. These jobs only pack, sign and upload what installer-build published (PUBLISH_DIR);
  # vpk, the packaging and signing tool itself, is the one tool installed. The Windows and macOS jobs sign when the
  # packages job found their platform's signing set up, and then check the signature before anything is uploaded
  # (docs/desktop.md#signing). vpk uploads into the draft release (--merge) and leaves it a draft: without --publish,
  # the update feeds are public only when the publish job publishes the release.
  installers:
    needs: [ desktop, installer-build ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
      # A version with a suffix (1.0.0-rc.1) goes into a prerelease, which the desktop app's updater does not take.
      VPK_PRE: ${{ contains(github.ref_name, '-') && '--pre' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-linux-x64

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk and the AppImage tools
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd
          dotnet tool install -g vpk --version 1.2.161

      - name: Package and attach
        run: |
          mkdir -p published && tar -C published -xzf publish-linux-x64.tar.gz
          PUBLISH_DIR=published deploy/package-installer.sh linux-x64 "${GITHUB_REF_NAME#v}" installers/linux-x64
          vpk upload github --outputDir installers/linux-x64 --channel linux-x64 \
            --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge $VPK_PRE

      # For installer-sbom (with the previous release's full package, when one was downloaded for the delta).
      # Kept 7 days, so a failed installer-sbom can be re-run after the day the release was cut.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-x64
          path: installers/linux-x64/*-full.nupkg
          if-no-files-found: error
          retention-days: 7

  installer-windows:
    needs: [ packages, desktop, installer-build ]
    environment: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
      # A version with a suffix (1.0.0-rc.1) goes into a prerelease, which the desktop app's updater does not take.
      VPK_PRE: ${{ contains(github.ref_name, '-') && '--pre' || '' }}
      SIGNING: ${{ needs.packages.outputs.windows-signing }}
      # Azure Trusted Signing: the credentials (DefaultAzureCredential reads them from the environment) and the
      # account's endpoint, name and certificate profile (repository variables).
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-win-x64

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Signing metadata
        if: env.SIGNING == 'signed'
        shell: bash
        run: |
          printf '{"Endpoint":"%s","CodeSigningAccountName":"%s","CertificateProfileName":"%s"}' \
            "$SIGNING_ENDPOINT" "$SIGNING_ACCOUNT" "$SIGNING_PROFILE" > "$RUNNER_TEMP/metadata.json"
          echo "AZURE_SIGN_METADATA=$RUNNER_TEMP/metadata.json" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          mkdir -p published && tar -C published -xzf publish-win-x64.tar.gz
          PUBLISH_DIR=published deploy/package-installer.sh win-x64 "${GITHUB_REF_NAME#v}" installers/win-x64

      # A release meant to be signed uploads nothing whose signature does not check out: the installer, and the
      # programs in the update package it installs (deploy/installer-signature-check.ps1).
      - name: Check the signatures
        shell: pwsh
        run: deploy/installer-signature-check.ps1 -Installers installers/win-x64 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Attach
        shell: bash
        run: |
          vpk upload github --outputDir installers/win-x64 --channel win-x64 \
            --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge $VPK_PRE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-win-x64
          path: installers/win-x64/*-full.nupkg
          if-no-files-found: error
          retention-days: 7

  installer-macos:
    needs: [ packages, desktop, installer-build ]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
      # A version with a suffix (1.0.0-rc.1) goes into a prerelease, which the desktop app's updater does not take.
      VPK_PRE: ${{ contains(github.ref_name, '-') && '--pre' || '' }}
      SIGNING: ${{ needs.packages.outputs.macos-signing }}
      # Signing and notarization (an Apple Developer account): the two Developer ID certificates as base64 .p12 files,
      # their password, the identities, and the Apple ID that notarizes.
      BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
      INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APP_IDENTITY: ${{ vars.APPLE_SIGN_APP_IDENTITY }}
      INSTALL_IDENTITY: ${{ vars.APPLE_SIGN_INSTALL_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publish-osx-*
          merge-multiple: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # A throw-away keychain with both certificates, and the notarytool profile vpk uses.
      - name: Signing keychain
        if: env.SIGNING == 'signed'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/build.p12"
          echo "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/build.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security import "$RUNNER_TEMP/installer.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" --password "$APPLE_PASSWORD" \
            --keychain "$keychain" semantic-router-notary
          {
            echo "APPLE_SIGN_APP_IDENTITY=$APP_IDENTITY"
            echo "APPLE_SIGN_INSTALL_IDENTITY=$INSTALL_IDENTITY"
            echo "APPLE_NOTARY_PROFILE=semantic-router-notary"
            echo "APPLE_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package
        run: |
          for rid in osx-arm64 osx-x64; do
            mkdir -p "published/$rid" && tar -C "published/$rid" -xzf "publish-$rid.tar.gz"
            PUBLISH_DIR="published/$rid" deploy/package-installer.sh "$rid" "${GITHUB_REF_NAME#v}" "installers/$rid"
          done

      # A release meant to be signed uploads nothing whose signature or notarization ticket does not check out: the
      # installer, the app in it, and the app in the update package, each signed by this team
      # (deploy/installer-signature-check.sh).
      - name: Check the signatures
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for rid in osx-arm64 osx-x64; do
            deploy/installer-signature-check.sh "installers/$rid" "${GITHUB_REF_NAME#v}" "$rid"
          done

      - name: Attach
        run: |
          for rid in osx-arm64 osx-x64; do
            vpk upload github --outputDir "installers/$rid" --channel "$rid" \
              --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge $VPK_PRE
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-osx
          path: installers/osx-*/*-full.nupkg
          if-no-files-found: error
          retention-days: 7

  # The installers' and update packages' SBOMs, one per platform, SemanticRouter-<version>-<rid>-installer.cdx.json,
  # read from the full update package each installer job built (deploy/installer-sbom.sh): the app as installed, plus
  # what vpk adds, Velopack's native binaries and, on Linux, the AppImage runtime. In a job of its own, so that Syft and
  # the restore never run next to the signing secrets or a token that can write.
  installer-sbom:
    needs: [ installers, installer-windows, installer-macos ]
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet restore src/SemanticRouter.Desktop/SemanticRouter.Desktop.csproj --locked-mode
          mkdir -p sboms
          for rid in linux-x64 win-x64 osx-arm64 osx-x64; do
            file="SemanticRouter-$version-$rid-full.nupkg"
            package="$(find installers -name "$file" | head -n 1)"
            if [ -z "$package" ]; then
              echo "::error::No $file from the installer jobs."
              exit 1
            fi
            deploy/installer-sbom.sh "$rid" "$version" "$package" "sboms/SemanticRouter-$version-$rid-installer.cdx.json" \
              "pkg:generic/SemanticRouter-$rid-installer@$version?download_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-installers
          path: sboms/*.cdx.json

  # Once every asset is signed and attached to the draft release: SHA256SUMS over all its assets; the NuGet and symbol
  # packages (as nuget.org will get them, before nuget.org adds its repository signature) and the packages', image's
  # and installers' SBOMs attached (the archives' came with them); and one build provenance attestation covering every
  # asset and SHA256SUMS, for `gh attestation verify`. The job downloads, hashes and uploads; it builds and runs nothing
  # from the repository. It first checks that the draft has every channel's update feed and the notices. Nothing has
  # been pushed or published yet (the image, NuGet and publish jobs come after this one), but the attestation is
  # public: it goes to the public Sigstore log and the repository's attestations, and stays there if the version is
  # given up.
  checksums:
    needs: [ packages, image-sbom, desktop, installers, installer-windows, installer-macos, installer-sbom ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: C
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: attach

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: attach

      - name: Checksums
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release --clobber
          cp attach/* release/
          rm -f release/SHA256SUMS
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      # The check publish makes again, here before anything irreversible: the image push and nuget come after this job.
      - name: The draft is complete
        run: |
          missing=()
          for asset in THIRD-PARTY-NOTICES.txt \
            releases.linux-x64.json releases.win-x64.json releases.osx-arm64.json releases.osx-x64.json; do
            [ -f "release/$asset" ] || missing+=("$asset")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The draft release $GITHUB_REF_NAME has no ${missing[*]}; nothing is published."
            exit 1
          fi

      - name: Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" attach/* release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # Last: the draft becomes the public release, and with it the desktop app's update feeds, which the updater reads
  # from published releases only. It runs only when everything else succeeded: every installer signed and checked, the
  # checksums and attestation attached, the image pushed and signed, and the NuGet packages pushed. It first checks
  # that the draft has every channel's update feed, the notices and SHA256SUMS.
  publish:
    needs: [ packages, checksums, image-sign, nuget ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINDOWS_SIGNING: ${{ needs.packages.outputs.windows-signing }}
      MACOS_SIGNING: ${{ needs.packages.outputs.macos-signing }}
    steps:
      - name: The draft is complete
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=()
          for asset in SHA256SUMS THIRD-PARTY-NOTICES.txt \
            releases.linux-x64.json releases.win-x64.json releases.osx-arm64.json releases.osx-x64.json; do
            grep -qxF "$asset" <<<"$assets" || missing+=("$asset")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The draft release $GITHUB_REF_NAME has no ${missing[*]}, so it is not published."
            exit 1
          fi

      # A stable release becomes the repository's latest release, as a release created published did; a prerelease
      # (1.0.0-rc.1, created as one) cannot be.
      - name: Publish the release
        run: |
          latest=()
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            latest=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"
          {
            echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            echo
            echo "Windows installers: $WINDOWS_SIGNING. macOS installers: $MACOS_SIGNING."
          } >> "$GITHUB_STEP_SUMMARY"
