name: Release

# Push a tag such as v0.2.0 to publish the NuGet packages (library, ASP.NET Core integration and the
# `semantic-router` dotnet tool), the container image (ghcr.io/<owner>/semantic-router) and the desktop app
# (self-contained downloads for Windows, macOS and Linux, and the installers with their update feeds, attached to the
# GitHub release).
on:
  push:
    tags: [ 'v*' ]

# Read-only by default; each job that publishes asks for the one extra permission it needs. Every publishing job runs
# in the `release` environment, so the repository owner can require an approval (and restrict it to v* tags) under
# Settings > Environments.
permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    environment: release
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts -p:Version="$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/*.nupkg

      # The key is only in this step's environment, not the test and pack steps'. Without it the push is skipped.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set; skipping the NuGet push."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  image:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/semantic-router"
          docker build -f src/SemanticRouter.Host/Dockerfile -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"

  desktop:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Every platform cross-publishes from Linux: the app is self-contained and its native parts come from NuGet.
      - name: Package
        run: |
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            deploy/package-desktop.sh "$rid" "${GITHUB_REF_NAME#v}" artifacts
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop
          path: artifacts/*

      - name: Attach to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

  # The installers (Velopack): the Linux AppImage is built here, the Windows Setup.exe on Windows (signing needs
  # signtool) and the macOS .pkg on macOS. Each platform is a channel with its own update feed; the previous release's
  # package is fetched for a delta update. Signing happens only when its secrets are set (docs/desktop.md#signing).
  installers:
    needs: desktop
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install vpk and the AppImage tools
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd
          dotnet tool install -g vpk --version 1.2.161

      - name: Package and attach
        run: |
          deploy/package-installer.sh linux-x64 "${GITHUB_REF_NAME#v}" installers/linux-x64
          vpk upload github --outputDir installers/linux-x64 --channel linux-x64 \
            --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge --publish

  installer-windows:
    needs: desktop
    environment: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
      # Azure Trusted Signing: the credentials (DefaultAzureCredential reads them from the environment) and the
      # account's endpoint, name and certificate profile (repository variables).
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Signing metadata
        if: env.AZURE_CLIENT_ID != '' && env.SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          printf '{"Endpoint":"%s","CodeSigningAccountName":"%s","CertificateProfileName":"%s"}' \
            "$SIGNING_ENDPOINT" "$SIGNING_ACCOUNT" "$SIGNING_PROFILE" > "$RUNNER_TEMP/metadata.json"
          echo "AZURE_SIGN_METADATA=$RUNNER_TEMP/metadata.json" >> "$GITHUB_ENV"

      - name: Package and attach
        shell: bash
        run: |
          deploy/package-installer.sh win-x64 "${GITHUB_REF_NAME#v}" installers/win-x64
          vpk upload github --outputDir installers/win-x64 --channel win-x64 \
            --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge --publish

  installer-macos:
    needs: desktop
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
      # Signing and notarization (an Apple Developer account): the two Developer ID certificates as base64 .p12 files,
      # their password, the identities, and the Apple ID that notarizes.
      BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
      INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APP_IDENTITY: ${{ vars.APPLE_SIGN_APP_IDENTITY }}
      INSTALL_IDENTITY: ${{ vars.APPLE_SIGN_INSTALL_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # A throw-away keychain with both certificates, and the notarytool profile vpk uses.
      - name: Signing keychain
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.APP_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/build.p12"
          echo "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/build.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security import "$RUNNER_TEMP/installer.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" --password "$APPLE_PASSWORD" \
            --keychain "$keychain" semantic-router-notary
          {
            echo "APPLE_SIGN_APP_IDENTITY=$APP_IDENTITY"
            echo "APPLE_SIGN_INSTALL_IDENTITY=$INSTALL_IDENTITY"
            echo "APPLE_NOTARY_PROFILE=semantic-router-notary"
            echo "APPLE_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package and attach
        run: |
          for rid in osx-arm64 osx-x64; do
            deploy/package-installer.sh "$rid" "${GITHUB_REF_NAME#v}" "installers/$rid"
            vpk upload github --outputDir "installers/$rid" --channel "$rid" \
              --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge --publish
          done
