name: Release

# Push a tag such as v0.2.0 to publish the NuGet packages (library, ASP.NET Core integration and the
# `semantic-router` dotnet tool), the container image (ghcr.io/<owner>/semantic-router) and the desktop app
# (self-contained downloads for Windows, macOS and Linux, and the installers with their update feeds, attached to the
# GitHub release).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      - name: Push to NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/semantic-router"
          docker build -f src/SemanticRouter.Host/Dockerfile -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"

  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Every platform cross-publishes from Linux: the app is self-contained and its native parts come from NuGet.
      - name: Package
        run: |
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            deploy/package-desktop.sh "$rid" "${GITHUB_REF_NAME#v}" artifacts
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: artifacts/*

      - name: Attach to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

  # The installers (Velopack): Windows Setup.exe and Linux AppImage are built here, the macOS .pkg on macOS (below).
  # Each platform is a channel with its own update feed; the previous release's package is fetched for a delta update.
  installers:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vpk and the AppImage tools
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd
          dotnet tool install -g vpk --version 1.2.161

      - name: Package and attach
        run: |
          for rid in win-x64 linux-x64; do
            deploy/package-installer.sh "$rid" "${GITHUB_REF_NAME#v}" "installers/$rid"
            vpk "[${rid%%-*}]" upload github --outputDir "installers/$rid" --channel "$rid" \
              --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge --publish
          done

  installer-macos:
    needs: desktop
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPK_PREVIOUS_FROM: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # Unsigned: macOS asks to confirm the first start (docs/desktop.md). Signing and notarizing need an Apple
      # Developer account (--signAppIdentity, --signInstallIdentity, --notaryProfile).
      - name: Package and attach
        run: |
          for rid in osx-arm64 osx-x64; do
            deploy/package-installer.sh "$rid" "${GITHUB_REF_NAME#v}" "installers/$rid"
            vpk upload github --outputDir "installers/$rid" --channel "$rid" \
              --repoUrl "$VPK_PREVIOUS_FROM" --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --merge --publish
          done
