name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Weekly run on main so a newly published advisory against an existing dependency fails CI
  # even when nobody has pushed.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      # Full history: a key committed and then deleted in a later commit is still leaked.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Built from the Go module proxy at a pinned version; the Go checksum database verifies the
      # source, so no third-party action or unverified binary download is involved.
      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Findings are redacted in the log. A confirmed false positive goes in .gitleaksignore by its
      # fingerprint (printed with each finding).
      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --no-banner .

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SEMANTIC_ROUTER_TEST_MODELS: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The ONNX embedding tests download two small models (57 MB) once and reuse them.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.models
          key: onnx-models-${{ hashFiles('src/SemanticRouter.Embeddings.Onnx/OnnxEmbeddingModels.cs') }}

      - name: Restore
        run: dotnet restore

      # NuGet advisories for direct and transitive packages. The scheduled run catches advisories
      # published after a dependency was added.
      - name: Check for vulnerable packages
        if: runner.os == 'Linux'
        run: |
          dotnet list package --vulnerable --include-transitive
          vulnerable=$(dotnet list package --vulnerable --include-transitive --format json \
            | jq -r '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .id] | unique | join(", ")')
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable NuGet packages: $vulnerable"
            exit 1
          fi

      # Whitespace and code style per .editorconfig, so formatting drift is caught in review rather
      # than fixed later in unrelated diffs. Run `dotnet format` locally to fix.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --collect:"XPlat Code Coverage"

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: packages
          path: artifacts/*.nupkg

  dashboard-e2e:
    name: dashboard end-to-end
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/dashboard-e2e/package-lock.json

      - name: Build the host
        run: dotnet build src/SemanticRouter.Host --configuration Release

      - name: Install Playwright and the screenshot fonts
        working-directory: tests/dashboard-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # Fails when a page throws or logs an error, a control loses its label, a flow breaks, a built-in theme drops
      # below WCAG AA, or a screenshot of a built-in theme changes.
      - name: Test
        working-directory: tests/dashboard-e2e
        run: npx playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dashboard-e2e-report
          path: |
            tests/dashboard-e2e/playwright-report
            tests/dashboard-e2e/test-results

  # The Windows installer: installs 1.0.0 per user, sets up the background service and sign-in entry, updates to 1.0.1
  # from a local feed, uninstalls, and checks nothing is left behind (tests/installer/windows.ps1).
  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Package 1.0.0 and 1.0.1
        shell: bash
        run: |
          deploy/package-installer.sh win-x64 1.0.0 installers
          cp installers/SemanticRouter-win-x64-Setup.exe SemanticRouter-1.0.0-Setup.exe
          deploy/package-installer.sh win-x64 1.0.1 installers

      - name: Install, update and uninstall
        shell: pwsh
        run: tests/installer/windows.ps1 -Setup SemanticRouter-1.0.0-Setup.exe -Feed installers

      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem $env:LOCALAPPDATA\SemanticRouter -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
          Get-Content $env:APPDATA\semantic-router\logs\semantic-router.log -Tail 60 -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Filter 'velopack*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          Get-ChildItem $env:LOCALAPPDATA\SemanticRouter -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }

  # The macOS installer: installs the 1.0.0 .pkg into ~/Applications and updates it to 1.0.1 from a local feed
  # (tests/installer/macos.sh). The .pkg can only be built on macOS.
  installer-macos:
    name: installer (macos)
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Package 1.0.0 and 1.0.1
        run: |
          deploy/package-installer.sh osx-arm64 1.0.0 installers
          cp installers/SemanticRouter-osx-arm64-Setup.pkg SemanticRouter-1.0.0.pkg
          deploy/package-installer.sh osx-arm64 1.0.1 installers

      - name: Install and update
        run: tests/installer/macos.sh SemanticRouter-1.0.0.pkg installers

  # The Linux AppImage: runs 1.0.0 and updates it to 1.0.1 from a local feed (tests/installer/linux.sh).
  installer-linux:
    name: installer (linux)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vpk and the AppImage tools
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd
          dotnet tool install -g vpk --version 1.2.161

      - name: Package 1.0.0 and 1.0.1
        run: |
          deploy/package-installer.sh linux-x64 1.0.0 installers
          cp installers/SemanticRouter-linux-x64.AppImage SemanticRouter-1.0.0.AppImage
          deploy/package-installer.sh linux-x64 1.0.1 installers

      - name: Run and update
        run: tests/installer/linux.sh SemanticRouter-1.0.0.AppImage installers

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image
        run: docker build -f src/SemanticRouter.Host/Dockerfile -t semantic-router:ci .

      - name: Smoke test
        run: |
          docker run -d --name router -p 5080:8080 -e ROUTER_ADMIN_TOKEN=ci-admin-token-0123456789 semantic-router:ci
          for i in $(seq 1 30); do curl -sf http://localhost:5080/v1/models > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5080/v1/models | grep -q '"auto"'
          # Port-mapped requests are remote: the admin API wants the token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/router/api/status)" = "401"
          curl -sf -H 'Authorization: Bearer ci-admin-token-0123456789' http://localhost:5080/router/api/status | grep -q '"version"'
          docker exec router test -f /data/semantic-router.json
          docker logs router

      - name: Logs on failure
        if: failure()
        run: docker logs router || true
