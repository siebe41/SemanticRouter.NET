name: Pages

# The documentation site on GitHub Pages: site/ (VitePress) builds it from the README, docs/, the samples and the other
# Markdown files, plus the videos attached to the `media` release, and this workflow publishes it. site/README.md says
# how it fits together and how to add a video.
#
# Pull requests that change the docs build the site without publishing it, so a broken link fails there. After
# uploading a video to the `media` release, run this workflow (Actions > Pages > Run workflow) to put it on the site.
on:
  push:
    branches: [ main ]
    paths: [ '**.md', 'docs/images/**', 'site/**', '.github/workflows/pages.yml' ]
  pull_request:
    paths: [ '**.md', 'docs/images/**', 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled half-way; a pull request's newer build replaces its older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Each page's "last updated" date comes from its file's history.
          fetch-depth: 0

      # No npm cache: what this job builds is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        working-directory: site
        run: npm ci

      - name: Videos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: site/fetch-videos.sh

      # The address the site is served under: /SemanticRouter.NET/, or / with a custom domain.
      - name: Pages settings
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        working-directory: site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PUBLISH" = true ]; then
            export SITE_BASE="$BASE_PATH/"
          fi
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.PUBLISH == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
