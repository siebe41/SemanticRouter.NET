name: Egress hosts

# `doctor` and docs/network.md are meant to be an exact firewall allowlist. The ONNX model download and the desktop
# updates go through redirects whose targets the router does not choose (Hugging Face's CDN, GitHub's release download
# host), so each week this follows them and fails when one lands on a host the list does not name.
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/SemanticRouter.Embeddings.Onnx/OnnxEmbeddingModels.cs'
      - 'src/SemanticRouter.Hosting/EgressList.cs'
      - 'tools/check-egress-hosts.py'
      - '.github/workflows/egress-hosts.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Follow the download redirects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check-egress-hosts.py "$GITHUB_REPOSITORY"
