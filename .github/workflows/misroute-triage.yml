name: Misroute triage

# Triages a "Routed to the wrong tier" report (.github/ISSUE_TEMPLATE/misroute.yml, which labels it routing-quality):
# `semantic-router triage-misroute` re-runs its paraphrased prompt on the reported release's built-in template,
# proposes an evaluation line and runs the template's evaluation set with and without it, and the result is posted as
# one comment. It is deterministic and calls no model, so it needs no secret. The maintainer who accepts the report
# removes needs-triage; this workflow never removes a label, pushes or opens a pull request.
#
# Anyone can open an issue, so the body is untrusted. It reaches the tool only as a file written from an environment
# variable, never inside a script, and the tool writes it back only inside code spans and blocks (no @mentions, HTML or
# links). The job that builds and runs the tool holds no token (deploy/workflow-secrets-check.sh): it hands the comment
# on as an artifact to a second job, which runs no dotnet and is the only one allowed to comment and label.
on:
  issues:
    types: [ opened, labeled ]

permissions: {}

# One run per issue at a time: a form's issue arrives as `opened` and as `labeled`, and the second run finds the first
# one's comment and stops.
concurrency:
  group: misroute-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'routing-quality')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'routing-quality')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      post: ${{ steps.triage.outputs.post }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the tool
        run: |
          dotnet restore --locked-mode src/SemanticRouter.Host/SemanticRouter.Host.csproj
          dotnet build --no-restore -c Release src/SemanticRouter.Host/SemanticRouter.Host.csproj

      # Exit code 1: the body is not the form (none of its headings), so nothing is posted. A report with ONNX
      # embeddings downloads that model from Hugging Face into the temporary SEMANTIC_ROUTER_HOME first.
      - name: Triage the report
        id: triage
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SEMANTIC_ROUTER_HOME: ${{ runner.temp }}/semantic-router
        run: |
          mkdir -p "$RUNNER_TEMP/triage"
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
          status=0
          dotnet src/SemanticRouter.Host/bin/Release/net10.0/semantic-router.dll triage-misroute \
            "$RUNNER_TEMP/issue-body.md" --issue "$ISSUE_NUMBER" > "$RUNNER_TEMP/triage/comment.md" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::notice::The issue is not a 'Routed to the wrong tier' report; nothing posted."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "post=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/triage/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.triage.outputs.post == 'true'
        with:
          name: misroute-triage-comment
          path: ${{ runner.temp }}/triage/comment.md
          retention-days: 1

  comment:
    needs: triage
    if: needs.triage.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: misroute-triage-comment
          path: ${{ runner.temp }}/triage

      # Only a comment of this workflow's own (github-actions[bot]) with the marker counts as an earlier triage.
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
              | grep -qF '<!-- semantic-router:misroute-triage -->'; then
            echo "Already triaged; nothing posted."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/triage/comment.md"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label routing-quality
