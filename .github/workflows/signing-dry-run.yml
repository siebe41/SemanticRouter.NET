name: Signing dry run

# Actions > Signing dry run > Run workflow, on main: signs a throw-away build of the desktop app with the release's own
# signing secrets, exactly as the release's installer jobs do, checks the signatures as they do, and uploads nothing
# but the macOS notarization submission to Apple.
# Run it, and have it pass, before deleting ALLOW_UNSIGNED_RELEASE, and again after rotating or renewing any signing
# secret or certificate (docs/releases.md#code-signing). A release whose signing fails stops while it is still a draft,
# but the dry run finds the problem without a tag, a version given up or a draft to delete.
#
# The build is win-x64 and osx-arm64, version 0.0.0-dryrun.<run number>, published in a job that holds no secret and
# can only read the repository, as in release.yml. The signing jobs then run the release's own scripts:
# deploy/signing-setup.sh (the Trusted Signing metadata, then the same Azure login by OIDC; the keychain and the
# notarytool profile), deploy/package-installer.sh, which has vpk sign (and on macOS notarize and staple), and
# deploy/check-signature-windows.ps1 and deploy/check-signature-macos.sh. As in the release, each secret goes only to the
# step that uses it. Unlike a release, a platform whose secrets are missing fails the run: there is no unsigned dry run.
# Nothing is uploaded anywhere but to Apple's notary service: no artifact of the signed files, no release, no update
# feed, and the token can only read (the Windows job may also ask for an OIDC token, for the Azure login, and runs in
# the windows-signing environment as the release's installer-windows does). Each job that signs checks again that the
# repository owner started it from main, so re-running one job alone is checked too. The run's summary names who signed
# each installer. deploy/signing-dry-run-check.sh, which CI runs, keeps it that way.
run-name: Signing dry run (${{ inputs.platforms }})

on:
  workflow_dispatch:
    inputs:
      # One platform at a time, for a platform whose certificates arrive first or whose secret was rotated.
      platforms:
        description: Platforms to sign
        required: true
        type: choice
        options: [ both, windows, macos ]
        default: both

permissions:
  contents: read

concurrency:
  group: signing-dry-run
  cancel-in-progress: false

jobs:
  # The app each installer packages, published on the installer's own OS, without secrets (release.yml's
  # installer-build). Tar keeps the executable bits that an artifact would lose.
  build:
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["windows","macos"]' || format('["{0}"]', inputs.platforms)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RID: ${{ matrix.platform == 'windows' && 'win-x64' || 'osx-arm64' }}
      VERSION: 0.0.0-dryrun.${{ github.run_number }}
    steps:
      # The same secrets as a release, so the same rule: only the repository owner, from main.
      - name: Only the repository owner, from main
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can run the signing dry run; this run was started by $TRIGGERING_ACTOR."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main (it was run on $GITHUB_REF): it signs with the release's secrets."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          deploy/publish-desktop.sh "$RID" "$VERSION" "publish/$RID"
          tar -C "publish/$RID" -czf "publish-$RID.tar.gz" .

      # The unsigned build, for the signing job only: kept for a day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ env.RID }}
          path: publish-${{ env.RID }}.tar.gz
          retention-days: 1

  # As release.yml's installer-windows, without the delta download and the upload: sign with Azure Trusted Signing,
  # then require a valid signature.
  windows:
    needs: build
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    # As release.yml's installer-windows: the environment whose OIDC token Azure accepts for signing.
    environment: windows-signing
    permissions:
      contents: read
      # For the Azure login by OIDC, as in the release; it can write nothing.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: 0.0.0-dryrun.${{ github.run_number }}
    steps:
      # Checked again here, not only in build: "Re-run job" on this job alone reuses build's result.
      - name: Only the repository owner, from main
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can run the signing dry run; this run was started by $TRIGGERING_ACTOR."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main (it was run on $GITHUB_REF): it signs with the release's secrets."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-win-x64

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Signing metadata
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: deploy/signing-setup.sh windows

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package and sign
        shell: bash
        run: |
          mkdir -p published && tar -C published -xzf publish-win-x64.tar.gz
          PUBLISH_DIR=published deploy/package-installer.sh win-x64 "$VERSION" installers/win-x64

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout || az account clear

      - name: Check the signature
        shell: pwsh
        run: ./deploy/check-signature-windows.ps1 installers/win-x64 -Required

  # As release.yml's installer-macos, for osx-arm64, without the delta download and the upload: sign, notarize and
  # staple, then require the signature and the ticket.
  macos:
    needs: build
    if: inputs.platforms != 'windows'
    runs-on: macos-latest
    environment: release
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: 0.0.0-dryrun.${{ github.run_number }}
    steps:
      # Checked again here, not only in build: "Re-run job" on this job alone reuses build's result.
      - name: Only the repository owner, from main
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can run the signing dry run; this run was started by $TRIGGERING_ACTOR."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main (it was run on $GITHUB_REF): it signs with the release's secrets."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-osx-arm64

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Signing keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTITY: ${{ vars.APPLE_SIGN_APP_IDENTITY }}
          INSTALL_IDENTITY: ${{ vars.APPLE_SIGN_INSTALL_IDENTITY }}
        run: deploy/signing-setup.sh macos

      - name: Package, sign and notarize
        run: |
          mkdir -p published/osx-arm64 && tar -C published/osx-arm64 -xzf publish-osx-arm64.tar.gz
          PUBLISH_DIR=published/osx-arm64 deploy/package-installer.sh osx-arm64 "$VERSION" installers/osx-arm64

      - name: Check the signature
        run: deploy/check-signature-macos.sh --required installers/osx-arm64
