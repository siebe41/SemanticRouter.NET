name: Downgrade

# Nightly, since it needs nuget.org: the current build migrates a home the newest release set up and used, then the
# newest published release is started on it, and again on the copy the upgrade kept (tests/installer/downgrade.sh,
# docs/host.md "Upgrading and going back"). The upgrade direction runs on every pull request
# (UpgradeFromReleasedVersionsTests and the installer jobs in ci.yml).
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the host
        run: dotnet build src/SemanticRouter.Host --configuration Release -p:RestoreLockedMode=true

      - name: Upgrade, then go back to the newest release
        run: tests/installer/downgrade.sh src/SemanticRouter.Host/bin/Release/net10.0/semantic-router.dll

  # A scheduled run has nobody watching it: when one fails, this opens an issue, or comments on the open one, so the
  # failure does not go unnoticed. It builds nothing, so the token it gets to do that is safe here
  # (deploy/workflow-secrets-check.sh).
  report-scheduled-failure:
    name: report a scheduled failure
    needs: [ downgrade ]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or comment on an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          deploy/report-issue.sh "Scheduled run failed: $GITHUB_WORKFLOW" \
            "The scheduled run of $GITHUB_WORKFLOW on $(date -u +%F) at ${GITHUB_SHA:0:7} failed: $RUN"
