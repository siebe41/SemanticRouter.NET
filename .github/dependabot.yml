version: 2
updates:
  # Versions are pinned centrally in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 8.x is commercially licensed; 7.x is the last Apache-2.0 line (Directory.Packages.props).
      - dependency-name: FluentAssertions
        versions: [ ">= 8.0.0" ]
    groups:
      # Its own pull request: a Velopack bump also needs the vpk pins in the workflows and
      # deploy/third-party/velopack-crates.json updated by hand (docs/releases.md), which deploy/velopack-version-check.sh
      # enforces, so it would hold every other update back. A dependency goes to the first group that matches it.
      velopack:
        patterns: [ "Velopack" ]
      nuget-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ minor, patch ]

  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  # The container's base images are pinned by digest; Dependabot moves the digest when Microsoft republishes a tag
  # (security fixes in the OS packages included).
  - package-ecosystem: docker
    directory: /src/SemanticRouter.Host
    schedule:
      interval: weekly

  # Playwright for the dashboard's end-to-end tests.
  - package-ecosystem: npm
    directory: /tests/dashboard-e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: [ "*" ]

  # VitePress and Mermaid for the documentation site (site/README.md).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: [ "*" ]

  # Playwright, node-pty and xterm.js for the demo-video tool (tools/demo-video/README.md). Every directory with a
  # package-lock.json needs an entry here: CI's npm audit (deploy/npm-audit-check.sh) fails without one.
  - package-ecosystem: npm
    directory: /tools/demo-video
    schedule:
      interval: weekly
    groups:
      demo-video:
        patterns: [ "*" ]
