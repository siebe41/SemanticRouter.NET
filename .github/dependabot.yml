version: 2
updates:
  # Versions are pinned centrally in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 8.x is commercially licensed; 7.x is the last Apache-2.0 line (Directory.Packages.props).
      - dependency-name: FluentAssertions
        versions: [ ">= 8.0.0" ]
    groups:
      nuget-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ minor, patch ]

  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  # The container's base images are pinned by digest; Dependabot moves the digest when Microsoft republishes a tag
  # (security fixes in the OS packages included).
  - package-ecosystem: docker
    directory: /src/SemanticRouter.Host
    schedule:
      interval: weekly

  # Playwright for the dashboard's end-to-end tests.
  - package-ecosystem: npm
    directory: /tests/dashboard-e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: [ "*" ]
