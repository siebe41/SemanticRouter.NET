name: Bug report
description: Something does not work as documented, crashes or gives an error.
labels: [ "bug", "needs-triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Search the open issues first in case it is already known.

        **Do not paste API keys, tokens, gateway keys or private prompt text.** Replace them with placeholders such as `<key>`. Security problems go through the Security tab ("Report a vulnerability"), not here.

        From the dashboard, the **Feedback** page (or **Report** on a failed request on the **Activity** page) opens this form with the version, the operating system and the request's decision line filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or requests that shows the problem.
      placeholder: |
        1. Start the router with ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Router version
      description: In the dashboard's sidebar footer and on Overview → Service, or from `semantic-router --version`. For the NuGet packages, the package version; built from source, the commit.
      placeholder: e.g. 0.2.0, or main at abc1234
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - semantic-router dotnet tool
        - Container image
        - Desktop app
        - NuGet packages in my own app
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: The request's decision line
      description: If it is about one request, its decision line from the dashboard's Activity entry (Report fills it in) or its `X-Prompt-Route-*` response headers.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The parts of the configuration involved, with every key and token replaced by a placeholder.
      render: jsonc
  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: Log lines, error responses or stack traces. Check them for keys and prompt text before posting.
      render: text
