<!doctype html>
<html lang="en" data-theme="machine-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Router</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,600|fira-sans:400,500,600">
  <link rel="stylesheet" href="__ROUTER_PREFIX__/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c1013'/%3E%3Cpath d='M6 16h8l4-8 4 16 4-8h0' fill='none' stroke='%23228fa7' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='16' r='2.8' fill='%23d08c34'/%3E%3C/svg%3E">
  <script>window.ROUTER_PREFIX = "__ROUTER_PREFIX__";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--brand-mark-bg)"/><path d="M6 16h8l4-8 4 16 4-8h0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="26" cy="16" r="2.8" fill="var(--signal)"/></svg>
        <div>
          <div class="brand-name">Semantic Router</div>
          <div class="brand-sub" id="brand-sub">loading…</div>
        </div>
      </div>
      <nav id="nav">
        <a href="#/overview" data-view="overview">Overview</a>
        <a href="#/live" data-view="live">Live</a>
        <a href="#/activity" data-view="activity">Activity</a>
        <a href="#/memory" data-view="memory">Memory</a>
        <a href="#/usage" data-view="usage">Usage</a>
        <div class="nav-group">Configuration</div>
        <a href="#/tiers" data-view="tiers">Tiers</a>
        <a href="#/routes" data-view="routes">Routes</a>
        <a href="#/evaluate" data-view="evaluate">Evaluate</a>
        <a href="#/models" data-view="models">Models</a>
        <a href="#/connectors" data-view="connectors">Connectors</a>
        <a href="#/routing" data-view="routing">Routing rules</a>
        <a href="#/profiles" data-view="profiles">Profiles</a>
        <a href="#/embeddings" data-view="embeddings">Embeddings</a>
        <a href="#/gateway" data-view="gateway">Gateway</a>
        <div class="nav-group">Use it</div>
        <a href="#/clients" data-view="clients">Connect clients</a>
        <a href="#/json" data-view="json">JSON</a>
      </nav>
      <div class="sidebar-footer">
        <label class="theme-picker">
          <span>Theme</span>
          <select id="theme-select" aria-label="Theme"></select>
        </label>
        <div class="muted small" id="lib-version"></div>
        <button class="btn ghost small hidden" id="sign-out" type="button">Sign out</button>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <div id="status-pill" class="pill">…</div>
        <div class="spacer"></div>
        <div id="save-bar" class="save-bar hidden">
          <span class="dirty-note">Unapplied changes</span>
          <button class="btn" data-action="validate">Validate</button>
          <button class="btn" data-action="apply" title="Apply to the running router without saving">Apply</button>
          <button class="btn primary" data-action="apply-save" title="Apply and write to the configuration store">Apply &amp; save</button>
          <button class="btn ghost" data-action="discard">Discard</button>
        </div>
      </header>
      <div id="banner" class="banner hidden"></div>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="__ROUTER_PREFIX__/graph.js"></script>
  <script src="__ROUTER_PREFIX__/app.js"></script>
</body>
</html>
